# Security headers for the single-page app. Included by every location that sends its own add_header
# (nginx does not inherit add_header from the parent block once a location defines one).
#
# The policy has no inline-script allowance: keep scripts in files. To use another origin (for example
# an S3 bucket for media), extend img-src / connect-src / font-src here; mount a customised copy over
# /etc/nginx/snippets/security-headers.conf to change it without rebuilding the image.
#
# 'wasm-unsafe-eval' lets the in-browser background removal compile its WebAssembly runtime. It does NOT
# allow eval() or new Function(), so scripts still cannot generate code from strings. The cut-out worker is
# a same-origin script (worker-src 'self'; blob: is for the runtime's optional helper threads) and the model
# file is fetched from this origin (connect-src 'self').
#
# The editor records voiceovers with the microphone, but only after the person grants it (microphone=(self): this
# site's own pages, never an embedded frame). Camera, location and the rest stay off.
#
# media-src lists the stock-video CDNs (Pexels, Pixabay) so a clip's preview plays when the pointer rests on it in
# the Videos tool; imported clips are served from this origin (or your media bucket: add its origin here too).
#
# Real-time co-editing opens a same-origin WebSocket (wss://<site>/ws/...). connect-src 'self' covers it in
# current browsers (CSP3: 'self' matches the ws/wss scheme of the same host); only Safari before 15.4 needs
# an explicit wss://<your site> entry.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob: https:; font-src 'self' data: blob:; connect-src 'self' blob: data: https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; worker-src 'self' blob:; media-src 'self' blob: https://videos.pexels.com https://cdn.pixabay.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), bluetooth=(), browsing-topics=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(self), payment=(), serial=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Strict-Transport-Security $hsts_header always;
