openapi: 3.1.0
info:
  title: Doory-compatible AI server
  version: 1.0.0
  summary: The small contract an AI image server implements so that Doory can use it with the "Doory-compatible" API style.
  description: |
    A Doory-compatible server lists its models and runs image tasks. Doory calls it from its backend (never from
    the browser), so the server can live on a private network next to Doory or anywhere on the internet.

    * Paths are relative to the base URL configured in Doory, which may include a path prefix
      (`https://ai.example.com/doory` → `https://ai.example.com/doory/v1/models`).
    * Authentication is optional. When the operator sets an auth header in Doory (for example
      `Authorization: Bearer …` or `X-Api-Key: …`), Doory sends it on every request unchanged.
    * Doory does not follow redirects; answer directly.
    * Tasks are named by id; a server lists the tasks each model supports. More tasks may be added later.
      * `background-removal`: an image in, the same image with a transparent background out, at the same
        size (a result of the same aspect ratio is scaled to it).
      * `upscale`: an image in, a larger one out. With the option `scale` (2 or 4), Doory scales a result of
        the same aspect ratio to exactly that many times the source's size; without it, the result keeps its
        size.
servers:
  - url: https://ai.example.com
paths:
  /v1/models:
    get:
      operationId: listModels
      summary: The models this server offers.
      responses:
        "200":
          description: The models, best first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
              example:
                models:
                  - id: general-fast
                    label: Fast
                    tasks: [background-removal]
                  - id: general-best
                    label: Best
                    tasks: [background-removal]
        "401":
          $ref: "#/components/responses/Error"
  /v1/{task}:
    post:
      operationId: runTask
      summary: Run a task on one image.
      parameters:
        - name: task
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9-]+$"
            examples: [background-removal, upscale]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: The source image (PNG, JPEG or WebP).
                model:
                  type: string
                  description: A model id from `/v1/models`. Absent or empty means the server's default.
                options:
                  type: string
                  description: |
                    Task options as a JSON object: `{"scale": 2}` or `{"scale": 4}` for upscale, none for
                    background-removal.
            encoding:
              image:
                contentType: image/png, image/jpeg, image/webp
      responses:
        "200":
          description: The result, as a PNG (preferred) or as JSON with a base64 PNG.
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                required: [image_b64]
                properties:
                  image_b64:
                    type: string
                    description: The PNG as base64 (a `data:image/png;base64,` prefix is accepted).
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
components:
  schemas:
    Model:
      type: object
      required: [id]
      properties:
        id:
          type: string
          maxLength: 200
          description: Sent back as `model` when this model is used.
        label:
          type: string
          maxLength: 80
          description: A short name for people, e.g. Fast or Best.
        tasks:
          type: array
          items:
            type: string
          description: The tasks this model supports; absent or empty means every task the server runs.
    ModelList:
      type: object
      required: [models]
      properties:
        models:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Model"
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    Error:
      description: |
        Any error. Doory reports 401/403 as refused credentials, 413 as an image too large, 429 as busy, and
        everything else as a failure; it never shows the body to users.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Optional. Any header name can be configured in Doory; this is one common choice.
security:
  - {}
  - bearer: []
