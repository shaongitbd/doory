name: Docker images

# Builds and publishes the backend and frontend images to ghcr.io. Only when started by hand (Actions > Docker
# images > Run workflow) by someone with write access: it never runs on pushes, pull requests or tags, so it can't
# use up the Actions budget on its own. Forks can't run it either (see `if:` below).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, e.g. 1.2.0 (empty publishes only the commit's sha tag)
        type: string
        required: false
        default: ""
      latest:
        description: Also tag this build as `latest`
        type: boolean
        default: false
      platforms:
        description: Platforms to build
        type: choice
        default: linux/amd64,linux/arm64
        options:
          - linux/amd64,linux/arm64
          - linux/amd64

concurrency:
  group: docker-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    if: github.repository == 'shaongitbd/doory'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: backend
            build-args: INSTALL_CHROMIUM=true
          - name: frontend
            context: frontend
            build-args: ""
    steps:
      # Inputs reach shell commands only through env vars, never pasted into the script.
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ] && ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The version must look like 1.2.0." >&2
            exit 1
          fi

      # Third-party actions are pinned to full commit SHAs (the release is in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/shaongitbd/doory-${{ matrix.name }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.latest }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Doory ${{ matrix.name }}
            org.opencontainers.image.licenses=AAL

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
